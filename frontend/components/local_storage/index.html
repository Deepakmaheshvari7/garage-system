<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: none;
    }
  </style>
</head>
<body>
<script>
  function sendMessage(type, data) {
    const payload = Object.assign({ type: type, apiVersion: 1 }, data || {});
    window.parent.postMessage(payload, "*");
  }

  function setHeight(h) {
    sendMessage("streamlit:setFrameHeight", { height: h });
  }

  function sendValue(val) {
    sendMessage("streamlit:setComponentValue", { value: val });
  }

  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "streamlit:render") {
      return;
    }
    const args = event.data.args || {};
    const action = args.action;
    const key = args.storage_key || args.key || "spm_auth_session";

    setHeight(0);

    try {
      if (action === "get") {
        const raw = localStorage.getItem(key);
        let parsed = null;
        if (raw) {
          try {
            parsed = JSON.parse(raw);
          } catch (e) {
            parsed = raw;
          }
        }
        sendValue(parsed);
      } else if (action === "set") {
        const toSave = typeof args.value === "string" ? args.value : JSON.stringify(args.value);
        localStorage.setItem(key, toSave);
        sendValue(args.value);
      } else if (action === "delete") {
        localStorage.removeItem(key);
        sendValue(null);
      }
    } catch (err) {
      console.error("Storage error:", err);
      sendValue(null);
    }
  });

  sendMessage("streamlit:componentReady");
  setHeight(0);
</script>
</body>
</html>
